name: Code verification (synthetic, CPU)
on:
  push:
    branches: [main, fix/minimal-runnable-research-code]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # only needed to attach the version tag after tests pass

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 scipy==1.16.0 scikit-learn==1.6.1 pytest==9.1.1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1+cpu'
      - name: Verify package imports and synthetic tests
        env:
          PYTHONPATH: src
        run: |
          python -m heval --help
          python -m heval info
          python -m pytest -q tests
      - name: Check no paper build artifacts or raw EEG entered the code repo
        shell: bash
        run: |
          test ! -d paper
          test ! -d results
          test ! -d data
          if find . -path './.git' -prune -o -type f \( -iname '*.edf' -o -iname '*.fif' -o -iname '*.pth' -o -iname '*.pt' -o -iname '*.npz' -o -iname '*.npy' \) -print | grep -q .; then
            echo 'Forbidden raw/model artifact present'
            exit 1
          fi

      - name: Prepare source-only anonymized reviewer ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/h-eval-anonymous"
          cp -a src tests requirements.txt README.md "${RUNNER_TEMP}/h-eval-anonymous/"
          echo 'Anonymized review snapshot. The author-identifying MIT licence and CITATION.cff are not in this review archive; the authors retain the code rights.' > "${RUNNER_TEMP}/h-eval-anonymous/REVIEW_NOTICE.txt"
          if grep -RIEq 'AliAmini93|Ali Amini|github.com/Ali|/home/armin|/media/armin|/mnt/HDD/AliWorks' "${RUNNER_TEMP}/h-eval-anonymous"; then
            echo 'STOP: identifying source content found in anonymous review archive'
            exit 1
          fi
          (cd "${RUNNER_TEMP}" && zip -qr "${GITHUB_WORKSPACE}/h-eval-anonymous-review-source.zip" h-eval-anonymous)
      - name: Upload reviewer source snapshot (still in private Actions; not a public anonymous URL)
        uses: actions/upload-artifact@v4
        with:
          name: h-eval-anonymous-review-source
          path: h-eval-anonymous-review-source.zip
          retention-days: 30
      - name: Create immutable code-release tag after all verification
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.2.0-code
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "STOP: ${tag} already exists; refusing to move an immutable release tag"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${tag}" -m "Validated minimal H-EVAL research code (74 synthetic tests)"
          git push origin "refs/tags/${tag}"
